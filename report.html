<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MYFIT AI — Personal Wellness Plan</title>
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eef2f7;color:#152238;font-family:Inter,Segoe UI,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{line-height:1.45}
.page{width:210mm;min-height:297mm;background:#fff;margin:12mm auto;padding:12mm;position:relative;page-break-after:always;overflow:hidden}
.page:last-of-type{page-break-after:auto}
.brand{font-size:10px;font-weight:900;letter-spacing:.18em;color:#00a88d;text-transform:uppercase}
h1{font-size:36px;line-height:.98;letter-spacing:-.045em;margin:10px 0}
h2{font-size:23px;letter-spacing:-.03em;margin:0 0 12px}h3{font-size:14px;margin:0 0 5px}
p{margin:0}.muted{color:#657286;font-size:10px}.eyebrow{font-size:8px;font-weight:900;letter-spacing:.16em;color:#6250c7;text-transform:uppercase}
.cover{background:#081525;color:#fff;border-radius:26px;min-height:273mm;padding:16mm;position:relative;overflow:hidden}
.cover:before,.cover:after{content:"";position:absolute;border-radius:50%;filter:blur(12px)}
.cover:before{width:180mm;height:110mm;right:-65mm;top:-40mm;background:radial-gradient(circle,#7560ff 0%,rgba(117,96,255,0) 68%);opacity:.32}
.cover:after{width:160mm;height:90mm;left:-70mm;bottom:-35mm;background:radial-gradient(circle,#00d9a6 0%,rgba(0,217,166,0) 68%);opacity:.18}
.cover-content{position:relative;z-index:2;display:flex;flex-direction:column;min-height:245mm}.cover-tag{font-size:8px;letter-spacing:.18em;color:#7df2d8;font-weight:900}.cover h1{font-size:48px;max-width:160mm;margin-top:20mm}.cover-lede{font-size:13px;color:#c8d3df;max-width:135mm;line-height:1.55}
.cover-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:18mm}.kpi{padding:12px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.06)}.kpi span{display:block;color:#9aa9ba;font-size:8px;text-transform:uppercase;letter-spacing:.1em}.kpi strong{display:block;font-size:20px;margin-top:5px}.cover-ring{margin-top:auto;align-self:flex-end;width:62mm;height:62mm}.cover-footer{margin-top:10mm;display:flex;justify-content:space-between;font-size:8px;color:#91a0b0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.panel{border:1px solid #dbe3ed;border-radius:18px;padding:14px;background:#fff;box-shadow:0 6px 18px rgba(11,31,53,.04)}.metric-card{min-height:84px}.metric-card span{display:block;font-size:8px;color:#738094;text-transform:uppercase;letter-spacing:.1em}.metric-card strong{display:block;font-size:24px;letter-spacing:-.04em;margin-top:5px}.metric-card small{font-size:8px;color:#738094}
.reality{display:grid;grid-template-columns:45mm 1fr;gap:18px;align-items:center;margin-top:12px}.ring{width:43mm;height:43mm}.reality-copy .status{display:inline-block;padding:5px 9px;border-radius:999px;font-weight:900;font-size:9px}.status.success{background:#e6fbf3;color:#087a5e}.status.warn{background:#fff4d6;color:#896400}.status.danger{background:#ffebeb;color:#aa3030}.reality-copy h3{font-size:20px;margin-top:8px}.bar{height:9px;border-radius:999px;background:#ecf1f6;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#7c5cff,#00d9a6)}
.section{margin-top:15px}.meal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.meal-card{border:1px solid #dbe3ed;border-radius:16px;padding:12px;background:linear-gradient(145deg,#fff,#f7fafc);break-inside:avoid}.meal-card .slot{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#00a488;font-weight:900}.meal-card h3{font-size:14px;margin-top:7px}.meal-card p{font-size:9px;color:#667386}.tag-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.tag{font-size:7px;border-radius:999px;background:#eef2ff;color:#5b45c6;padding:3px 5px}
.workout-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.workout-card{border:1px solid #dbe3ed;border-radius:16px;padding:12px;break-inside:avoid}.workout-head{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:8px;border-bottom:1px solid #e7edf3;padding-bottom:8px}.day{font-size:9px;font-weight:900;color:#5b45c6}.workout-head strong{font-size:13px}.workout-head span{font-size:8px;color:#738094}.exercise{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed #e3e8ef;font-size:8px}.exercise:last-child{border-bottom:0}.exercise span{color:#738094}
.roadmap{display:grid;grid-template-columns:1fr 1fr;gap:9px}.road{display:grid;grid-template-columns:28px 1fr;gap:9px;align-items:start;border:1px solid #dbe3ed;border-radius:15px;padding:10px}.road-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eef2ff;color:#5b45c6;font-size:8px;font-weight:900}.road:first-child .road-dot{background:linear-gradient(135deg,#7c5cff,#00d9a6);color:#fff}.road b{font-size:8px;color:#7b8798;text-transform:uppercase;letter-spacing:.12em}.road strong{display:block;font-size:11px;margin-top:2px}.road p{font-size:8px;color:#667386;margin-top:3px}
.habits{display:grid;grid-template-columns:1fr 1fr;gap:10px}.habit{border:1px solid #dbe3ed;border-radius:14px;padding:12px;display:flex;gap:9px;align-items:center}.habit-icon{width:26px;height:26px;border-radius:8px;background:#eef2ff;color:#5b45c6;display:grid;place-items:center;font-size:8px;font-weight:900}.habit strong{font-size:10px}
.chart{border:1px solid #dbe3ed;border-radius:18px;padding:12px}.chart-box{height:57mm;border-radius:12px;background:repeating-linear-gradient(to bottom,#fff 0,#fff 13mm,#eef2f6 13.1mm);overflow:hidden}.chart-box svg{width:100%;height:100%}
.safety{background:#fffaf0;border-color:#f0dca2}.final{background:#fff;display:flex;flex-direction:column;justify-content:center}.final .quote{font-size:39px;font-weight:900;line-height:.98;letter-spacing:-.05em;max-width:170mm}.final .accent{color:#5b45c6;margin-top:10px}.footer{margin-top:auto;padding-top:9px;border-top:1px solid #e5eaf0;display:flex;justify-content:space-between;font-size:7px;color:#8792a2}
.toolbar{position:fixed;right:18px;top:18px;z-index:10;display:flex;gap:8px}.toolbar button{border:0;border-radius:12px;padding:10px 14px;font-weight:800;background:linear-gradient(135deg,#7c5cff,#00d9a6);color:#fff;cursor:pointer;box-shadow:0 8px 20px rgba(65,50,160,.2)}
@media print{body{background:#fff}.page{margin:0;box-shadow:none}.toolbar{display:none}}
@media(max-width:900px){.page{width:auto;min-height:0;margin:0;padding:24px}.cover{min-height:calc(100vh - 48px)}.cover-kpis,.grid4{grid-template-columns:1fr 1fr}.workout-grid,.meal-grid,.grid2,.roadmap,.habits{grid-template-columns:1fr}.reality{grid-template-columns:1fr}.cover-ring{align-self:center;margin-top:25mm}}
</style>
</head>
<body>
<div class="toolbar"><button id="printBtn">Save / Print as PDF</button><button id="backBtn" style="background:#132238">Back to MYFIT AI</button></div>
<div id="report"></div>
<script>
(() => {
'use strict';
const KEY='myfit-ai-github-v1';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}};
const state=load()||{}; const p=state.profile||{}; const m=state.metrics||{}; const pl=state.plan||{}; const progress=state.progress||{};
function goalLabel(g){return g==='fatloss'?'Fat loss':g==='muscle'?'Muscle + fitness':'General fitness'};
function realityLabel(r){return r?.label||r?.tone==='danger'?'TIMELINE REQUIRES RECONSIDERATION':r?.tone==='warn'?'NEEDS ADJUSTMENT':'REALISTIC'};
const current=Number(p.weight||0),target=Number(p.target||0),gap=Math.abs(current-target); const latest=Number((progress.weights||[]).slice(-1)[0]?.weight||current);
const done=target&&current!==target?Math.max(0,Math.min(100,Math.round((Math.max(0,gap-Math.abs(latest-target))/Math.max(gap,.1))*100))):0;
const tone=m.reality?.tone||'success';
const color=tone==='danger'?'#dc3f3f':tone==='warn'?'#d38b00':'#0a9d78';
const circumference=2*Math.PI*44, dash=(circumference*done/100).toFixed(1);
const meals=(pl.nutrition?.meals||[]).map(x=>`<article class="meal-card"><div class="slot">${esc(x.slot)}</div><h3>${esc(x.item?.name||'')}</h3><p>${esc(x.item?.portion||'')}</p><div class="tag-row">${(x.item?.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></article>`).join('');
const workouts=(pl.workout?.sessions||[]).map(s=>`<article class="workout-card"><div class="workout-head"><div class="day">${esc(s.day||'')}</div><div><strong>${esc(s.focus||'')}</strong><span>${s.duration||p.minutes||'—'} min</span></div><span>${esc(pl.workout?.mode||'')}</span></div>${(s.exercises||[]).map(e=>`<div class="exercise"><b>${esc(e.name||'')}</b><span>${esc(e.sets||e.prescription?.sets||'—')} × ${esc(e.reps||e.prescription?.reps||'—')}</span></div>`).join('')}</article>`).join('');
const roads=(pl.roadmap||[]).map((w,i)=>`<div class="road"><div class="road-dot">${w.week||i+1}</div><div><b>Week ${w.week||i+1}</b><strong>${esc(w.title||w.focus||'')}</strong><p>${esc(w.target||w.highlight||'')}</p></div></div>`).join('');
const habits=(pl.habits||[]).map((h,i)=>`<div class="habit"><span class="habit-icon">${String(i+1).padStart(2,'0')}</span><strong>${esc(typeof h==='string'?h:h.title||'')}</strong></div>`).join('');
let trend='<div style="height:100%;display:grid;place-items:center;color:#738094;font-size:10px">No progress entries yet — log a weight in MYFIT AI to reveal your local trend.</div>';
const entries=(progress.weights||[]).filter(x=>Number.isFinite(Number(x.weight)));
if(entries.length>1){const vals=entries.slice(-10).map(x=>Number(x.weight)),min=Math.min(...vals,target),max=Math.max(...vals,target),rg=Math.max(1,max-min);const pts=vals.map((v,i)=>{const x=6+i*(88/Math.max(1,vals.length-1)),y=92-((v-min)/rg)*76;return `${x},${y}`}).join(' ');trend=`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><defs><linearGradient id="grad" x1="0" x2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#00d9a6"/></linearGradient></defs><line x1="5" y1="92" x2="95" y2="92" stroke="#dbe3ed" stroke-width="1"/><polyline points="${pts}" fill="none" stroke="url(#grad)" stroke-width="2.7" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>${target?`<line x1="5" y1="${92-((target-min)/rg)*76}" x2="95" y2="${92-((target-min)/rg)*76}" stroke="#00a488" stroke-width="1" stroke-dasharray="3 2" vector-effect="non-scaling-stroke"/>`:''}</svg>`}
const report=`
<section class="page"><div class="cover"><div class="cover-content"><div class="cover-tag">MYFIT AI · PERSONAL WELLNESS & FITNESS PLANNER</div><h1>Your plan, designed around your life.</h1><p class="cover-lede">A visual wellness plan built from your goals, routine, food preferences and available time — generated locally in your browser.</p><div class="cover-kpis"><div class="kpi"><span>Current</span><strong>${current||'—'} kg</strong></div><div class="kpi"><span>Target</span><strong>${target||'—'} kg</strong></div><div class="kpi"><span>BMI</span><strong>${m.bmi?Number(m.bmi).toFixed(1):'—'}</strong></div><div class="kpi"><span>Timeline</span><strong>${m.reality?.weeks||'—'} wks</strong></div></div><svg class="cover-ring" viewBox="0 0 110 110"><circle cx="55" cy="55" r="44" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="10"/><circle cx="55" cy="55" r="44" fill="none" stroke="url(#coverGrad)" stroke-width="10" stroke-linecap="round" transform="rotate(-90 55 55)" stroke-dasharray="${dash} ${circumference.toFixed(1)}"/><defs><linearGradient id="coverGrad" x1="0" x2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#00d9a6"/></linearGradient></defs><text x="55" y="53" fill="#fff" font-size="19" font-weight="900" text-anchor="middle">${done}%</text><text x="55" y="65" fill="#cbd6e2" font-size="7" text-anchor="middle">JOURNEY</text></svg><div class="cover-footer"><span>${esc(p.name||'MYFIT User')} · ${goalLabel(p.goal)}</span><span>Generated locally</span></div></div></div></section>
<section class="page"><div class="eyebrow">01 · YOUR BASELINE</div><h2>Profile & Reality Check</h2><div class="grid4"><div class="panel metric-card"><span>Height</span><strong>${p.height||'—'} cm</strong><small>${esc(p.activity||'—')} activity</small></div><div class="panel metric-card"><span>Weight</span><strong>${current||'—'} → ${target||'—'} kg</strong><small>${gap.toFixed(1)} kg planned change</small></div><div class="panel metric-card"><span>BMR</span><strong>${m.bmr?Math.round(m.bmr):'—'}</strong><small>estimated kcal/day</small></div><div class="panel metric-card"><span>TDEE</span><strong>${m.tdee?Math.round(m.tdee):'—'}</strong><small>estimated kcal/day</small></div></div><div class="panel reality section" style="--reality:${color}"><svg class="ring" viewBox="0 0 110 110"><circle class="ring-bg" cx="55" cy="55" r="44" fill="none" stroke="#e7ebf0" stroke-width="10"/><circle cx="55" cy="55" r="44" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" transform="rotate(-90 55 55)" stroke-dasharray="${dash} ${circumference.toFixed(1)}"/><text x="55" y="53" fill="#152238" font-size="15" font-weight="900" text-anchor="middle">${done}%</text><text x="55" y="65" fill="#738094" font-size="7" text-anchor="middle">JOURNEY</text></svg><div class="reality-copy"><span class="status ${tone}">${esc(realityLabel(m.reality))}</span><h3>${m.reality?.rate?Number(m.reality.rate).toFixed(1):'—'} kg/week planning rate</h3><p>${esc(m.reality?.msg||'')}</p><div class="bar"><span style="width:${Math.max(8,Math.min(100,(Number(m.reality?.rate||0)/1.2)*100))}%"></span></div><p style="margin-top:8px">BMI ${m.bmi?Number(m.bmi).toFixed(1):'—'} · BMI is a screening measure, not a diagnosis.</p></div></div><div class="panel section"><div class="eyebrow">WHY THIS PLAN</div><p class="muted" style="margin-top:5px">${esc(goalLabel(p.goal))} · ${esc(p.diet||'')}</p><p class="muted">${p.gym?'Gym access':'No gym'} · ${p.days||'—'} days/week · ${p.minutes||'—'} min/session · ${p.meals||'—'} meals/day</p></div><div class="footer"><span>MYFIT AI</span><span>01 · Baseline</span></div></section>
<section class="page"><div class="eyebrow">02 · FUEL</div><h2>Nutrition that fits your day</h2><div class="meal-grid">${meals||'<div class="panel"><p class="muted">No meal cards available for this profile.</p></div>'}</div><div class="panel section"><div class="eyebrow">PLANNING NOTE</div><p class="muted" style="margin-top:5px">Meals are practical planning examples filtered to the selected diet style. They are not medical nutrition prescriptions.</p></div><div class="eyebrow section">03 · MOVE</div><h2>Adaptive workout plan</h2><div class="workout-grid">${workouts||'<div class="panel"><p class="muted">No workout programming is shown for a flagged safety condition.</p></div>'}</div><div class="footer"><span>MYFIT AI</span><span>02 · Fuel & Move</span></div></section>
<section class="page"><div class="eyebrow">04 · ROADMAP</div><h2>From goal to weekly milestones</h2><div class="roadmap">${roads}</div><div class="eyebrow section">05 · HABITS</div><h2>The small promises</h2><div class="habits">${habits}</div><div class="eyebrow section">06 · PROGRESS</div><h2>Your local trend</h2><div class="chart"><div class="chart-box">${trend}</div><p class="muted" style="margin-top:7px">${entries.length?entries.length+' local weight entries logged.':'No progress entries yet.'}</p></div><div class="footer"><span>MYFIT AI</span><span>03 · Roadmap & Progress</span></div></section>
<section class="page final"><div class="eyebrow">07 · SAFETY</div><h2>Wellness, not medical treatment</h2><div class="panel safety"><p class="muted">MYFIT AI is a wellness and fitness planning tool. It is not a medical diagnosis or treatment tool and does not replace a doctor or registered dietitian. BMI, BMR, TDEE and timeline outputs are estimates. Optional photos are for visual personalization only and are not analyzed for body measurements or medical conditions.</p></div><div class="quote" style="margin-top:22mm">YOUR PLAN IS NOT A PUNISHMENT.</div><div class="quote accent">IT'S A SYSTEM YOU CAN ACTUALLY LIVE WITH.</div><div class="footer"><span>MYFIT AI</span><span>Generated locally in your browser</span></div></section>`;
document.getElementById('report').innerHTML=report;
document.getElementById('printBtn').onclick=()=>window.print();
document.getElementById('backBtn').onclick=()=>location.href='./';
})();
</script>
</body>
</html>
